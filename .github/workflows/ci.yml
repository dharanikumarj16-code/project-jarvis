name: JARVIS Windows Automation & CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Validate JARVIS on Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Startup Diagnostics
        run: |
          python -c "from app.diagnostics import run_startup_diagnostics, print_startup_dashboard; d = run_startup_diagnostics(); print_startup_dashboard(d)"

      - name: Run Full Test Suite
        run: |
          pytest tests/ -v
